name: Publish support and privacy pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "assets/icon.png"
      - "assets/favicon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Until site/site.config.json is filled in there is nothing safe to publish, so skip quietly.
      - id: config
        run: |
          if node -e 'const c=require("./site/site.config.json"); process.exit(Object.values(c).every((v) => String(v).trim()) ? 0 : 1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::site/site.config.json is not filled in yet, so the pages were not published."
          fi
      - if: steps.config.outputs.ready == 'true'
        run: node scripts/build-site.mjs
      - if: steps.config.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.config.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: steps.config.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
