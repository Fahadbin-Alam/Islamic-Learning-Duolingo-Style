# Render Blueprint for the Muslimo API and its Postgres database.
# In Render: New > Blueprint, pick this repository, then fill in the secrets it asks for.
services:
  - type: web
    name: muslimo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SIRA_ENVIRONMENT
        value: production
      - key: SIRA_DATABASE_URL
        fromDatabase:
          name: muslimo-db
          property: connectionString
      - key: SIRA_REVENUECAT_WEBHOOK_AUTH
        sync: false
      # Google sign-in: the same web client id the app is built with (EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID).
      - key: SIRA_GOOGLE_CLIENT_IDS_RAW
        sync: false

databases:
  - name: muslimo-db
    databaseName: muslimo
    plan: basic-256mb
