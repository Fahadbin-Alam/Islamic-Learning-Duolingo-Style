<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;font-family:"Inter Display","Inter",sans-serif;
 background:linear-gradient(150deg,#1FC57A 0%,#15B76B 50%,#0E8C55 100%)}
.blob{position:absolute;border-radius:22%;background:rgba(255,255,255,.08)}
.left{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px}
.icon{width:112px;height:112px;border-radius:28px;box-shadow:0 10px 28px rgba(5,60,35,.35);border:3px solid rgba(255,255,255,.85)}
h1{color:#fff;font-size:76px;font-weight:900;line-height:1}
p{color:#FFF6D8;font-size:36px;font-weight:800;line-height:1.15;margin-top:26px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:17px;padding:8px 14px;border-radius:999px}
.phone{position:absolute;right:70px;top:46px;width:300px;height:620px;border-radius:44px;overflow:hidden;border:7px solid #fff;
 box-shadow:0 22px 50px rgba(5,60,35,.45);transform:rotate(6deg);background:#fff}
.phone img{width:100%;display:block}
.moon{position:absolute;width:46px;height:46px;border-radius:50%;background:#F4C542;right:398px;top:52px}
.moon:after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:#1BBF74;left:13px;top:-4px}
.star{position:absolute;width:16px;height:16px;border-radius:50%;background:#F4C542;right:40px;top:36px}
</style></head><body>
<div class="blob" style="width:520px;height:520px;right:-160px;top:-260px;transform:rotate(22deg)"></div>
<div class="blob" style="width:300px;height:300px;left:-120px;bottom:-170px;transform:rotate(-18deg)"></div>
<div class="moon"></div><div class="star"></div>
<div class="left">
 <div class="brand"><img class="icon" src="../../../assets/icon.png"><h1>Muslimo</h1></div>
 <p>Learn Islam a little<br>every day</p>
 <div class="chips"><span class="chip">Quran</span><span class="chip">Salah</span><span class="chip">Sahabah</span><span class="chip">Hadith</span><span class="chip">Manners</span></div>
</div>
<div class="phone"><img id="shot"></div>
<script>document.getElementById("shot").src = new URLSearchParams(location.search).get("img");</script>
</body></html>
